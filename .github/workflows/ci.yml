name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Profile README and logo are present
        run: test -s profile/README.md && test -s profile/logo.png
      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.17.2 "**/*.md" "#node_modules"
      - name: Workflow lint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
